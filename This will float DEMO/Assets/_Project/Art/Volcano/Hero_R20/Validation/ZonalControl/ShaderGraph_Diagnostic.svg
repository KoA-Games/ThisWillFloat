<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171b21"/><stop offset="1" stop-color="#0d1014"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#75bde8"/></marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.sub{font:500 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#aab5c0}
      .head{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.txt{font:500 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#d9e2ea}
      .small{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9fb2c2}.box{fill:#242a32;stroke:#526171;stroke-width:2;rx:12}
      .fn{fill:#283344;stroke:#75bde8;stroke-width:2;rx:12}.out{fill:#273a30;stroke:#7bc497;stroke-width:2;rx:12}.wire{fill:none;stroke:#75bde8;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#bg)"/>
  <text x="52" y="64" class="title">Volcano R20 — Control RGBA Zonal Shader Graph</text>
  <text x="52" y="96" class="sub">Actual asset: Volcano_Hero_R20_ZonalControl.shadergraph · URP Lit · Opaque · Front · Alpha Clip Off</text>

  <rect x="52" y="135" width="410" height="370" class="box"/>
  <text x="76" y="174" class="head">1 · Control RGBA normalization</text>
  <text x="76" y="211" class="txt">ControlRGBA (UV0, linear)</text>
  <text x="76" y="244" class="txt">R = exposed rock / ash</text>
  <text x="76" y="273" class="txt">G = vegetation ground</text>
  <text x="76" y="302" class="txt">B = soil / ochre earth</text>
  <text x="76" y="331" class="txt">A = summit / crater rock</text>
  <rect x="76" y="358" width="360" height="118" class="fn"/>
  <text x="94" y="391" class="txt">weighted = mask × zoneWeight</text>
  <text x="94" y="421" class="txt">sum = max(R+G+B+A, .0001)</text>
  <text x="94" y="451" class="txt">normalized = weighted / sum</text>

  <rect x="508" y="135" width="410" height="370" class="box"/>
  <text x="532" y="174" class="head">2 · Zone-color reconstruction</text>
  <text x="532" y="214" class="txt">RockAshColor × normalizedR</text>
  <text x="532" y="249" class="txt">+ VegetationColor × normalizedG</text>
  <text x="532" y="284" class="txt">+ SoilColor × normalizedB</text>
  <text x="532" y="319" class="txt">+ SummitColor × normalizedA</text>
  <rect x="532" y="357" width="360" height="118" class="fn"/>
  <text x="550" y="398" class="txt">zoneColor = weighted color sum</text>
  <text x="550" y="431" class="small">No sequential tint multiplication</text>
  <text x="550" y="458" class="small">Each zone remains independently adjustable</text>

  <rect x="964" y="135" width="410" height="370" class="box"/>
  <text x="988" y="174" class="head">3 · BaseMap detail preservation</text>
  <text x="988" y="211" class="txt">luma = dot(BaseMap.rgb,</text>
  <text x="988" y="238" class="txt">  float3(.2126,.7152,.0722))</text>
  <text x="988" y="276" class="txt">detail = contrast around mid-gray</text>
  <text x="988" y="311" class="txt">multiplier = lerp(1, detail,</text>
  <text x="988" y="338" class="txt">  DetailStrength)</text>
  <rect x="988" y="365" width="360" height="110" class="fn"/>
  <text x="1006" y="405" class="txt">reconstructed = zoneColor × detail</text>
  <text x="1006" y="439" class="txt">final = lerp(BaseMap, reconstructed,</text>
  <text x="1006" y="463" class="txt">             RecolorStrength)</text>

  <rect x="1420" y="135" width="328" height="370" class="box"/>
  <text x="1444" y="174" class="head">4 · Surface channels</text>
  <text x="1444" y="216" class="txt">NormalMap → Strength</text>
  <text x="1444" y="251" class="txt">AOMap.r → AOIntensity</text>
  <text x="1444" y="286" class="txt">MetalSmooth.a → multiplier</text>
  <text x="1444" y="321" class="txt">Metallic = 0</text>
  <rect x="1444" y="358" width="278" height="117" class="fn"/>
  <text x="1462" y="396" class="txt">NormalTS</text>
  <text x="1462" y="426" class="txt">Occlusion</text>
  <text x="1462" y="456" class="txt">Smoothness (saturate)</text>

  <path d="M462 320H508" class="wire"/><path d="M918 320H964" class="wire"/><path d="M1374 320H1420" class="wire"/>

  <rect x="52" y="552" width="1090" height="500" class="box"/>
  <text x="76" y="594" class="head">Exposed Blackboard properties (19 / 19)</text>
  <text x="76" y="635" class="txt">Textures</text>
  <text x="260" y="635" class="small">_BaseMap · _NormalMap · _AOMap · _MetallicSmoothnessMap · _ControlRGBA</text>
  <text x="76" y="682" class="txt">Zone colors</text>
  <text x="260" y="682" class="small">_RockAshColor · _VegetationColor · _SoilColor · _SummitColor</text>
  <text x="76" y="729" class="txt">Zone weights</text>
  <text x="260" y="729" class="small">_RockAshWeight 1.00 · _VegetationWeight .72 · _SoilWeight .85 · _SummitWeight 1.15</text>
  <text x="76" y="776" class="txt">Reconstruction</text>
  <text x="260" y="776" class="small">_RecolorStrength .70 · _DetailStrength .55 · _DetailContrast 1.00</text>
  <text x="76" y="823" class="txt">Surface</text>
  <text x="260" y="823" class="small">_NormalStrength 1.00 · _AOIntensity 1.00 · _SmoothnessMultiplier 1.00</text>
  <rect x="76" y="862" width="1038" height="155" class="out"/>
  <text x="100" y="905" class="head">URP Lit Master Stack outputs</text>
  <text x="100" y="946" class="txt">Base Color · Normal (Tangent Space) · Metallic 0 · Smoothness · Occlusion</text>
  <text x="100" y="980" class="small">Baked erosion/detail is retained through luminance; color distribution is rebuilt from normalized RGBA masks.</text>

  <rect x="1190" y="552" width="558" height="500" class="box"/>
  <text x="1214" y="594" class="head">Validation state</text>
  <text x="1214" y="640" class="txt">Shader supported: TRUE</text>
  <text x="1214" y="678" class="txt">Control sRGB: OFF</text>
  <text x="1214" y="716" class="txt">Control alpha retained: TRUE</text>
  <text x="1214" y="754" class="txt">All five textures assigned: TRUE</text>
  <text x="1214" y="792" class="txt">R19/R20 locked hashes unchanged: TRUE</text>
  <text x="1214" y="830" class="txt">Production scenes modified: FALSE</text>
  <text x="1214" y="868" class="txt">FBX/model modified: FALSE</text>
  <text x="1214" y="906" class="txt">Material left at defaults: TRUE</text>
  <text x="1214" y="962" class="small">Generated from the serialized Shader Graph, material, prefab, importer metadata, and Unity preview render results.</text>
</svg>
